name: Uptime Record

# RESPALDO. El disparador principal es cron-job.org.
#
# Este workflow NO es fiable, y está medido: entre las 22:35 UTC del 22-nov y
# las 16:10 del 23-nov hubo 2 ejecuciones programadas de las ~17 que tocaban, y
# las dos con mucho retraso (la ventana de 00:10 corrió a las 00:48; la de
# 08:10, a las 08:57). Los crons de GitHub Actions no garantizan puntualidad y
# se descartan bajo carga.
#
# Se mantiene porque no cuesta nada y las filas que escribe son válidas: el
# agregado calcula `operativas / comprobaciones` por día, así que filas de más
# no distorsionan nada. Si cron-job.org deja de disparar, esto sigue dando
# señal en vez de dejar la gráfica vacía.
#
# Tampoco puede moverse a los crons de Vercel. Se intentó y el despliegue FALLÓ
# con el mensaje de la propia plataforma:
#
#   «Hobby accounts are limited to daily cron jobs. This cron expression
#    (10 * * * *) would run more than once per day. Upgrade to the Pro plan
#    to unlock all Cron Jobs features on Vercel.»
#
# Con una comprobación diaria el porcentaje de un día saldría de una sola
# muestra: 100% o 0%, sin nada en medio. Si el proyecto pasa a Pro, moverlo es
# un cambio de seis líneas y Vercel ya manda el `Authorization: Bearer
# $CRON_SECRET` que la ruta espera, así que no haría falta tocar código.
#
# El disparador externo usa `UPTIME_CRON_SECRET`, una llave que SOLO abre esta
# ruta — el `CRON_SECRET` general abre once, incluidas las que borran filas y
# envían correo (ver `requireUptimeCronAuth` en `src/lib/cronAuth.ts`).
#
# Cada hora, en el minuto 10. Desplazado respecto a `check-health.yml` (que
# corre en el minuto 0) a propósito: son dos cosas distintas y conviene que no
# compitan. `check-health` AVISA en el momento si algo está caído; esto
# REGISTRA el resultado para que `/status` pueda dibujar un histórico real.
#
# Con una comprobación por hora, 90 días son ~2160 filas. Si el workflow falla
# o el despliegue está caído, no se escribe fila: ese hueco sale en la gráfica
# como «sin datos», que es la verdad, nunca como 100%.

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  uptime-record:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar comprobación de disponibilidad
        run: |
          SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Secrets no configurados. Saltando uptime-record."
            exit 0
          fi
          curl -X GET "${SITE_URL}/api/cron/uptime-record" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -f
