name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-integration:
    name: Unit & Integration Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests unitarios e integración
        run: npm run test:ci
        env:
          # Variables mínimas para que los mocks no fallen por schema de zod
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          TELEGRAM_BOT_TOKEN: 0000000000:AAtest
          TELEGRAM_CHAT_ID: '12345'
          CRON_SECRET: test-cron-secret-long

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    needs: unit-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          TELEGRAM_BOT_TOKEN: 0000000000:AAtest
          TELEGRAM_CHAT_ID: '12345'
          CRON_SECRET: test-cron-secret-long
          NEXT_PUBLIC_CALCOM_INTERVIEW_URL: https://cal.com/test/entrevista
          NEXT_PUBLIC_CALCOM_CONSULT_URL: https://cal.com/test/consulta
          NEXT_PUBLIC_WHATSAPP_NUMBER: '573000000000'
          NEXT_PUBLIC_SITE_URL: https://test.com

  security:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit (HIGH y CRITICAL)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Verificar anti-hardcoding
        run: bash scripts/check-no-hardcode.sh

      - name: Verificar secretos en staged files
        run: |
          FOUND=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [[ "$file" == .github/* ]] && continue
            [[ "$file" == *.yml ]] && continue
            [[ "$file" == *.md ]] && continue
            if grep -qP "gsk_[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9]{20,}" "$file" 2>/dev/null; then
              echo "⚠️ Posible secreto en: $file"
              FOUND=1
            fi
          done < <(git diff --name-only HEAD~1 HEAD)
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "✅ Sin secretos detectados en archivos modificados"

  e2e:
    name: Tests E2E (Cypress)
    runs-on: ubuntu-latest
    needs: build
    # Requiere secrets reales de Supabase para funcionar
    # Si no estan configurados, el job se salta (exit 0)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verificar secrets requeridos
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::warning::Falta SUPABASE_URL en GitHub Secrets."
            echo "::warning::Los tests E2E requieren backend real. Saltando."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        if: steps.check_secrets.outputs.skip != 'true'
        run: npm ci

      - name: Construir aplicación
        if: steps.check_secrets.outputs.skip != 'true'
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_CALCOM_INTERVIEW_URL: ${{ secrets.NEXT_PUBLIC_CALCOM_INTERVIEW_URL }}
          NEXT_PUBLIC_CALCOM_CONSULT_URL: ${{ secrets.NEXT_PUBLIC_CALCOM_CONSULT_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Iniciar servidor
        if: steps.check_secrets.outputs.skip != 'true'
        run: npm start &
        env:
          PORT: 3000
          # T-23 encontró el motivo real de pasarlas también aquí: el
          # middleware llama a `createServerClient` en CADA petición a
          # /admin/*, sin esperar a que nadie visite algo que las necesite
          # de verdad — a diferencia de una página que las carga solo si
          # algo la usa (ver el fix de T-18 en `[locale]/page.tsx`), el
          # middleware no tiene ese margen: sin estas variables, cualquier
          # ruta /admin/* (hasta /admin/login, público) responde 500.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_CALCOM_INTERVIEW_URL: ${{ secrets.NEXT_PUBLIC_CALCOM_INTERVIEW_URL }}
          NEXT_PUBLIC_CALCOM_CONSULT_URL: ${{ secrets.NEXT_PUBLIC_CALCOM_CONSULT_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Esperar a que el servidor esté listo
        if: steps.check_secrets.outputs.skip != 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Ejecutar Cypress
        if: steps.check_secrets.outputs.skip != 'true'
        run: npx cypress run --spec "cypress/e2e/smoke.cy.ts,cypress/e2e/visual-regression.cy.ts"

      # T-23: las capturas de regresión visual (home, visor de proyectos,
      # login del panel a 375/1280px) se suben en CADA corrida, no solo si
      # algo falla — son "capturas de referencia" para comparar a mano una
      # corrida contra la anterior, no un diff de píxeles automático (no
      # hay plugin de eso instalado; la ficha pide reusar Cypress tal cual).
      - name: Subir capturas de Cypress (regresión visual + fallos, si los hay)
        uses: actions/upload-artifact@v7
        if: always() && steps.check_secrets.outputs.skip != 'true'
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 14
          if-no-files-found: warn
